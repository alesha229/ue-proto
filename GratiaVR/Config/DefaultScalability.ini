; Particles in GratiaVR come only from the environment packs (fog sheets, steam, rain). The engine
; default thins them to 1/8-1/2 at Low-High, which leaves the Soul: City rain almost invisible.
[EffectsQuality@0]
r.EmitterSpawnRateScale=0.5

[EffectsQuality@1]
r.EmitterSpawnRateScale=0.75

[EffectsQuality@2]
r.EmitterSpawnRateScale=1.0
