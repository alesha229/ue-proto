[SystemSettings]
; Forward VR with baked lighting: screen-space AO (enabled by the packs' post-process volumes) costs ~1.5 ms per frame.
r.AmbientOcclusionLevels=0
; Translucency straight into scene colour: the separate (after-DOF) pass needs its own MSAA target, resolve and
; compose, 0.6-1.1 ms of the High VR frame whenever anything translucent is in view. There is no depth of field.
r.SeparateTranslucency=0
; No temporal AA or motion blur (forward MSAA): velocities of materials that move their vertices (the rain) only
; added a velocity pass with the whole skinned character in it (0.26 ms).
r.Velocity.EnableVertexDeformation=0
; Refraction: only the packs' rain splashes used it, a distortion pass and two composites per eye (0.2 ms).
r.DisableDistortion=1

